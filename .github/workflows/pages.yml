name: Publish A12 Mortgage Kit Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mortgage-pages
  cancel-in-progress: true

jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for print QA
        run: npx playwright install --with-deps chromium

      - name: Verify content, figures, and audience
        run: npm run verify

      - name: Render all pages and reject overflow
        run: npm run render

      - name: Verify PDF and page images
        run: |
          python -m pip install pypdf
          python scripts/verify-pdf.py

      - name: Save proof PDF and four page previews
        uses: actions/upload-artifact@v4
        with:
          name: mortgage-kit-print-proof
          path: dist/
          retention-days: 30

      - name: Prepare public development site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -R dist site/proofs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
